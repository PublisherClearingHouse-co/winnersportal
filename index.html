<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <link rel="manifest" href="manifest.json" />

<body>

        <div id="header-placeholder"></div>

            <div style="display:flex;gap:16px;margin-top:24px;flex-wrap:wrap;justify-content:center;">

                <a href="admin.html" class="btn btn-outline">🔧 Admin Login</a>
            </div>
        </div>
        <div id="footer-placeholder"></div>

    <script>
        fetch('includes/header.html').then(r=>r.text()).then(h=>document.getElementById('header-placeholder').innerHTML=h);
        fetch('includes/footer.html').then(r=>r.text()).then(h=>document.getElementById('footer-placeholder').innerHTML=h);
